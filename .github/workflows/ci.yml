name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Test (compile + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: PWA/BusinessFieldOps/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: PWA/BusinessFieldOps/
        run: pnpm install --frozen-lockfile

      - name: Compile
        working-directory: PWA/BusinessFieldOps/
        run: pnpm run compile

      - name: Lint
        working-directory: PWA/BusinessFieldOps/
        run: pnpm run lint

  build:
    name: Build
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: PWA/BusinessFieldOps//pnpm-lock.yaml

      - name: Install dependencies
        working-directory: PWA/BusinessFieldOps/
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: PWA/BusinessFieldOps/
        run: pnpm run build